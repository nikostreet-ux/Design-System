<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Rosen · Tienda</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--white)}#root{min-height:100vh}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Catalog.jsx"></script>
<script type="text/babel" src="Product.jsx"></script>
<script type="text/babel" src="Cart.jsx"></script>
<script type="text/babel" data-presets="react">
(function(){
const { Dialog, Button } = window.RosenDesignSystem_99eac3;
function App(){
  const [view,setView]=React.useState('home');
  const [cart,setCart]=React.useState(1);
  const [added,setAdded]=React.useState(false);
  React.useEffect(()=>{window.scrollTo(0,0)},[view]);
  const add=()=>{setCart(c=>c+1);setAdded(true)};
  return <div>
    <Header onNav={setView} cart={cart}/>
    {view==='home'&&<Home onNav={setView}/>}
    {view==='catalog'&&<Catalog onNav={setView}/>}
    {view==='product'&&<Product onNav={setView} addToCart={add}/>}
    {view==='cart'&&<Cart onNav={setView}/>}
    <Footer/>
    <Dialog open={added} title="Producto agregado" onClose={()=>setAdded(false)}
      footer={<><Button variant="ghost" onClick={()=>setAdded(false)}>Seguir viendo</Button><Button onClick={()=>{setAdded(false);setView('cart')}}>Ir al carro</Button></>}>
      Colchón Élite Pocket · 1 unidad agregada a tu carro.
    </Dialog>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script></body></html>
