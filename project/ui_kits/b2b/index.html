<!-- @startingPoint section="B2B" subtitle="Portal mayorista Rosen: login, dashboard, precios y pedidos" viewport="1440x900" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Rosen · Portal Mayorista</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--gray-10)}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="PriceList.jsx"></script>
<script type="text/babel" src="OrderDetail.jsx"></script>
<script type="text/babel" data-presets="react">
(function(){
const TITLES={dashboard:['Mi cuenta','Resumen de cuenta'],prices:['Catálogo mayorista','Lista de precios'],order:['Pedidos','Detalle de pedido'],docs:['Documentos','Facturas y guías'],team:['Configuración','Mi equipo']};
function App(){
  const [logged,setLogged]=React.useState(false);
  const [view,setView]=React.useState('dashboard');
  if(!logged) return <Login onEnter={()=>setLogged(true)}/>;
  const [crumb,title]=TITLES[view]||TITLES.dashboard;
  return <div style={{display:'flex',alignItems:'stretch'}}>
    <Sidebar view={view} onNav={setView}/>
    <main style={{flex:1,minWidth:0}}>
      <Topbar crumb={crumb} title={title}/>
      {view==='dashboard'&&<Dashboard onNav={setView}/>}
      {view==='prices'&&<PriceList/>}
      {view==='order'&&<OrderDetail/>}
      {(view==='docs'||view==='team')&&<div style={{padding:'var(--space-8)',color:'var(--text-muted)',fontSize:15}}>Vista no definida en las fuentes entregadas — pendiente de material de marca.</div>}
    </main>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script></body></html>
