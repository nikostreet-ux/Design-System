<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-size:13px}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-md)}.sw b{font-weight:var(--weight-medium);font-size:12px;display:block}.sw span{font-size:11px;opacity:.75;display:block}.lbl{font-size:11px;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="background:var(--rosen-slate);color:#fff;"><b>slate</b><span>base</span></div><div class="sw" style="background:var(--rosen-slate-hover);color:#fff;"><b>slate hover</b><span>l − .05</span></div><div class="sw" style="background:var(--rosen-slate-press);color:#fff;"><b>slate press</b><span>l − .10</span></div><div class="sw" style="background:var(--rosen-red);color:#fff;"><b>rojo</b><span>base</span></div><div class="sw" style="background:var(--rosen-red-hover);color:#fff;"><b>rojo hover</b><span>l − .05</span></div><div class="sw" style="background:var(--rosen-red-press);color:#fff;"><b>rojo press</b><span>l − .10</span></div></div></body></html>
