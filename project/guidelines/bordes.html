<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-size:13px}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-md)}.sw b{font-weight:var(--weight-medium);font-size:12px;display:block}.sw span{font-size:11px;opacity:.75;display:block}.lbl{font-size:11px;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div style="flex:1;height:80px;border:1px solid var(--border-subtle);border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--text-muted);text-align:center">--border-subtle<br>#EEEEEE</div><div style="flex:1;height:80px;border:1px solid var(--border-default);border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--text-muted);text-align:center">--border-default<br>#CCCCCC</div><div style="flex:1;height:80px;border:1px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--text-muted);text-align:center">--border-strong<br>#CDD2D1</div><div style="flex:1;height:80px;border:1px solid var(--border-focus);border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--text-muted);text-align:center">--border-focus<br>#38484E</div></div></body></html>
