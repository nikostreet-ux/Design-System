<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-size:13px}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-md)}.sw b{font-weight:var(--weight-medium);font-size:12px;display:block}.sw span{font-size:11px;opacity:.75;display:block}.lbl{font-size:11px;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div style="flex:1;height:80px;border:1px solid var(--border-default);border-radius:0;display:grid;place-items:center;font-size:12px;color:var(--text-muted)">none · 0</div><div style="flex:1;height:80px;border:1px solid var(--border-default);border-radius:2px;display:grid;place-items:center;font-size:12px;color:var(--text-muted)">sm · 2px</div><div style="flex:1;height:80px;border:1px solid var(--border-default);border-radius:4px;display:grid;place-items:center;font-size:12px;color:var(--text-muted)">md · 4px</div><div style="flex:1;height:80px;border:1px solid var(--border-default);border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--text-muted)">lg · 8px</div><div style="flex:1;height:80px;border:1px solid var(--border-default);border-radius:999px;display:grid;place-items:center;font-size:12px;color:var(--text-muted)">pill · 999px</div></div></body></html>
