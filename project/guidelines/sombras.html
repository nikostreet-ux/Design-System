<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-size:13px}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-md)}.sw b{font-weight:var(--weight-medium);font-size:12px;display:block}.sw span{font-size:11px;opacity:.75;display:block}.lbl{font-size:11px;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="padding:10px 0"><div style="flex:1;height:90px;background:#fff;border-radius:4px;box-shadow:var(--shadow-xs);display:grid;place-items:center;font-size:12px;color:var(--text-muted)">xs</div><div style="flex:1;height:90px;background:#fff;border-radius:4px;box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:12px;color:var(--text-muted)">sm</div><div style="flex:1;height:90px;background:#fff;border-radius:4px;box-shadow:var(--shadow-md);display:grid;place-items:center;font-size:12px;color:var(--text-muted)">md</div><div style="flex:1;height:90px;background:#fff;border-radius:4px;box-shadow:var(--shadow-lg);display:grid;place-items:center;font-size:12px;color:var(--text-muted)">lg</div></div></body></html>
