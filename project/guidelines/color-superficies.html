<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-size:13px}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;padding:10px;border-radius:var(--radius-md)}.sw b{font-weight:var(--weight-medium);font-size:12px;display:block}.sw span{font-size:11px;opacity:.75;display:block}.lbl{font-size:11px;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="background:var(--surface-page);color:#4C4C4C;border:1px solid #EEE"><b>--surface-page</b><span>#FFFFFF</span></div><div class="sw" style="background:var(--surface-subtle);color:#4C4C4C;"><b>--surface-subtle</b><span>#F5F5F5</span></div><div class="sw" style="background:var(--surface-alt);color:#4C4C4C;"><b>--surface-alt</b><span>#EEEEEE</span></div><div class="sw" style="background:var(--surface-inverse);color:#fff;"><b>--surface-inverse</b><span>#38484E</span></div><div class="sw" style="background:var(--surface-accent);color:#fff;"><b>--surface-accent</b><span>#C12637</span></div></div></body></html>
